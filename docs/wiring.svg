<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="660" fill="#ffffff"/>

  <text x="40" y="42" font-size="17" font-weight="bold" fill="#222">Memory game wiring</text>
  <text x="40" y="63" font-size="12" fill="#555">Arduino Uno</text>

  <!-- Board -->
  <rect x="40" y="90" width="150" height="455" fill="#14707a" stroke="#0d5259" stroke-width="2"/>
  <text x="115" y="330" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 115 330)">ARDUINO UNO</text>

  <!-- Ground rail -->
  <line x1="790" y1="105" x2="790" y2="600" stroke="#333" stroke-width="2"/>
  <text x="800" y="110" font-size="12" fill="#333">GND</text>
  <line x1="776" y1="600" x2="804" y2="600" stroke="#333" stroke-width="2.5"/>
  <line x1="782" y1="607" x2="798" y2="607" stroke="#333" stroke-width="2.5"/>
  <line x1="787" y1="614" x2="793" y2="614" stroke="#333" stroke-width="2.5"/>

  <!-- ===== Lane 1 : D13 LED (red) ===== -->
  <text x="182" y="124" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">13</text>
  <line x1="190" y1="120" x2="300" y2="120" stroke="#333" stroke-width="1.8"/>
  <rect x="300" y="111" width="60" height="18" fill="#e8e0cc" stroke="#333" stroke-width="1.6"/>
  <line x1="360" y1="120" x2="430" y2="120" stroke="#333" stroke-width="1.8"/>
  <polygon points="430,108 430,132 454,120" fill="#d94b46" stroke="#333" stroke-width="1.5"/>
  <line x1="454" y1="106" x2="454" y2="134" stroke="#333" stroke-width="2.2"/>
  <line x1="454" y1="120" x2="790" y2="120" stroke="#333" stroke-width="1.8"/>
  <text x="478" y="112" font-size="12" fill="#555">LED 1</text>

  <!-- Lane 1 : D12 button -->
  <text x="182" y="164" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">12</text>
  <line x1="190" y1="160" x2="430" y2="160" stroke="#333" stroke-width="1.8"/>
  <line x1="430" y1="160" x2="430" y2="148" stroke="#333" stroke-width="1.8"/>
  <line x1="478" y1="160" x2="478" y2="148" stroke="#333" stroke-width="1.8"/>
  <line x1="416" y1="144" x2="492" y2="144" stroke="#333" stroke-width="2.2"/>
  <circle cx="430" cy="160" r="3.2" fill="#333"/>
  <circle cx="478" cy="160" r="3.2" fill="#333"/>
  <line x1="478" y1="160" x2="790" y2="160" stroke="#333" stroke-width="1.8"/>
  <text x="502" y="176" font-size="12" fill="#555">Button 1</text>

  <!-- ===== Lane 2 : D10 LED (blue) ===== -->
  <text x="182" y="219" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">10</text>
  <line x1="190" y1="215" x2="300" y2="215" stroke="#333" stroke-width="1.8"/>
  <rect x="300" y="206" width="60" height="18" fill="#e8e0cc" stroke="#333" stroke-width="1.6"/>
  <line x1="360" y1="215" x2="430" y2="215" stroke="#333" stroke-width="1.8"/>
  <polygon points="430,203 430,227 454,215" fill="#3b7fd4" stroke="#333" stroke-width="1.5"/>
  <line x1="454" y1="201" x2="454" y2="229" stroke="#333" stroke-width="2.2"/>
  <line x1="454" y1="215" x2="790" y2="215" stroke="#333" stroke-width="1.8"/>
  <text x="478" y="207" font-size="12" fill="#555">LED 2</text>

  <!-- Lane 2 : D9 button -->
  <text x="182" y="259" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">9</text>
  <line x1="190" y1="255" x2="430" y2="255" stroke="#333" stroke-width="1.8"/>
  <line x1="430" y1="255" x2="430" y2="243" stroke="#333" stroke-width="1.8"/>
  <line x1="478" y1="255" x2="478" y2="243" stroke="#333" stroke-width="1.8"/>
  <line x1="416" y1="239" x2="492" y2="239" stroke="#333" stroke-width="2.2"/>
  <circle cx="430" cy="255" r="3.2" fill="#333"/>
  <circle cx="478" cy="255" r="3.2" fill="#333"/>
  <line x1="478" y1="255" x2="790" y2="255" stroke="#333" stroke-width="1.8"/>
  <text x="502" y="271" font-size="12" fill="#555">Button 2</text>

  <!-- ===== Lane 3 : D7 LED (green) ===== -->
  <text x="182" y="314" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">7</text>
  <line x1="190" y1="310" x2="300" y2="310" stroke="#333" stroke-width="1.8"/>
  <rect x="300" y="301" width="60" height="18" fill="#e8e0cc" stroke="#333" stroke-width="1.6"/>
  <line x1="360" y1="310" x2="430" y2="310" stroke="#333" stroke-width="1.8"/>
  <polygon points="430,298 430,322 454,310" fill="#46a06a" stroke="#333" stroke-width="1.5"/>
  <line x1="454" y1="296" x2="454" y2="324" stroke="#333" stroke-width="2.2"/>
  <line x1="454" y1="310" x2="790" y2="310" stroke="#333" stroke-width="1.8"/>
  <text x="478" y="302" font-size="12" fill="#555">LED 3</text>

  <!-- Lane 3 : D6 button -->
  <text x="182" y="354" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">6</text>
  <line x1="190" y1="350" x2="430" y2="350" stroke="#333" stroke-width="1.8"/>
  <line x1="430" y1="350" x2="430" y2="338" stroke="#333" stroke-width="1.8"/>
  <line x1="478" y1="350" x2="478" y2="338" stroke="#333" stroke-width="1.8"/>
  <line x1="416" y1="334" x2="492" y2="334" stroke="#333" stroke-width="2.2"/>
  <circle cx="430" cy="350" r="3.2" fill="#333"/>
  <circle cx="478" cy="350" r="3.2" fill="#333"/>
  <line x1="478" y1="350" x2="790" y2="350" stroke="#333" stroke-width="1.8"/>
  <text x="502" y="366" font-size="12" fill="#555">Button 3</text>

  <!-- ===== Reset LED : D5 (yellow) ===== -->
  <text x="182" y="409" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">5</text>
  <line x1="190" y1="405" x2="300" y2="405" stroke="#333" stroke-width="1.8"/>
  <rect x="300" y="396" width="60" height="18" fill="#e8e0cc" stroke="#333" stroke-width="1.6"/>
  <line x1="360" y1="405" x2="430" y2="405" stroke="#333" stroke-width="1.8"/>
  <polygon points="430,393 430,417 454,405" fill="#e0a92e" stroke="#333" stroke-width="1.5"/>
  <line x1="454" y1="391" x2="454" y2="419" stroke="#333" stroke-width="2.2"/>
  <line x1="454" y1="405" x2="790" y2="405" stroke="#333" stroke-width="1.8"/>
  <text x="478" y="397" font-size="12" fill="#555">Reset LED</text>

  <!-- Reset button : D4 -->
  <text x="182" y="449" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">4</text>
  <line x1="190" y1="445" x2="430" y2="445" stroke="#333" stroke-width="1.8"/>
  <line x1="430" y1="445" x2="430" y2="433" stroke="#333" stroke-width="1.8"/>
  <line x1="478" y1="445" x2="478" y2="433" stroke="#333" stroke-width="1.8"/>
  <line x1="416" y1="429" x2="492" y2="429" stroke="#333" stroke-width="2.2"/>
  <circle cx="430" cy="445" r="3.2" fill="#333"/>
  <circle cx="478" cy="445" r="3.2" fill="#333"/>
  <line x1="478" y1="445" x2="790" y2="445" stroke="#333" stroke-width="1.8"/>
  <text x="502" y="461" font-size="12" fill="#555">Reset button</text>

  <!-- ===== Buzzer : D3, through three 220R in parallel ===== -->
  <text x="182" y="524" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">3</text>
  <line x1="190" y1="520" x2="280" y2="520" stroke="#333" stroke-width="1.8"/>

  <!-- left and right buses joining the three branches -->
  <line x1="280" y1="475" x2="280" y2="565" stroke="#333" stroke-width="1.8"/>
  <line x1="380" y1="475" x2="380" y2="565" stroke="#333" stroke-width="1.8"/>
  <circle cx="280" cy="520" r="3.2" fill="#333"/>
  <circle cx="380" cy="520" r="3.2" fill="#333"/>

  <!-- branch 1 -->
  <line x1="280" y1="475" x2="300" y2="475" stroke="#333" stroke-width="1.8"/>
  <rect x="300" y="466" width="60" height="18" fill="#e8e0cc" stroke="#333" stroke-width="1.6"/>
  <line x1="360" y1="475" x2="380" y2="475" stroke="#333" stroke-width="1.8"/>
  <!-- branch 2 -->
  <line x1="280" y1="520" x2="300" y2="520" stroke="#333" stroke-width="1.8"/>
  <rect x="300" y="511" width="60" height="18" fill="#e8e0cc" stroke="#333" stroke-width="1.6"/>
  <line x1="360" y1="520" x2="380" y2="520" stroke="#333" stroke-width="1.8"/>
  <!-- branch 3 -->
  <line x1="280" y1="565" x2="300" y2="565" stroke="#333" stroke-width="1.8"/>
  <rect x="300" y="556" width="60" height="18" fill="#e8e0cc" stroke="#333" stroke-width="1.6"/>
  <line x1="360" y1="565" x2="380" y2="565" stroke="#333" stroke-width="1.8"/>

  <text x="330" y="595" font-size="12" fill="#555" text-anchor="middle">3 x 220R in parallel = 73R</text>

  <!-- buzzer -->
  <line x1="380" y1="520" x2="452" y2="520" stroke="#333" stroke-width="1.8"/>
  <circle cx="478" cy="520" r="26" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <line x1="466" y1="510" x2="478" y2="510" stroke="#333" stroke-width="1.6"/>
  <line x1="472" y1="504" x2="472" y2="516" stroke="#333" stroke-width="1.6"/>
  <line x1="504" y1="520" x2="790" y2="520" stroke="#333" stroke-width="1.8"/>
  <text x="516" y="512" font-size="12" fill="#555">Piezo buzzer</text>

  <text x="40" y="626" font-size="12" fill="#555">All resistors are 220R.</text>
  <text x="40" y="644" font-size="12" fill="#555">Buttons wire straight to ground and use INPUT_PULLUP, so they need no resistor.</text>
</svg>
